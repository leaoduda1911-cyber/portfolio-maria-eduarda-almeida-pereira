<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de IMC</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="card">
  <h1>Calculadora de IMC</h1>

  <label for="peso">Peso (kg)</label>
  <input type="number" id="peso" placeholder="Ex: 70" step="0.1" min="0">

  <label for="altura">Altura (m)</label>
  <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01" min="0">

  <button onclick="calcularIMC()">Calcular IMC</button>

  <div id="resultado"></div>

  <div class="tabela">
    <table>
      <tr><td>Menor que 18,5</td><td>Baixo peso</td></tr>
      <tr><td>18,5 a 24,9</td><td>Peso normal</td></tr>
      <tr><td>25 a 29,9</td><td>Sobrepeso</td></tr>
      <tr><td>30 a 34,9</td><td>Obesidade grau I</td></tr>
      <tr><td>35 a 39,9</td><td>Obesidade grau II</td></tr>
      <tr><td>40 ou mais</td><td>Obesidade grau III (mórbida)</td></tr>
    </table>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
